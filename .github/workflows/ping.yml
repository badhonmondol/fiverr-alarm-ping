name: Keep Render Alive

on:
  schedule:
    # প্রতি ৫ মিনিটে চালু হবে
    # ভেতরে ৪ মিনিট loop করবে → প্রতি ১ মিনিটে ping
    # দুটো job মিলে ১০ মিনিটে ৮-৯ বার ping হবে
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Ping Render every minute for 4 minutes
        run: |
          HEALTH_URL="${{ secrets.HEALTH_URL }}"
          echo "🚀 Ping loop started at $(date)"

          for i in $(seq 1 4); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              --connect-timeout 5 \
              "$HEALTH_URL" 2>/dev/null || echo "000")

            if [ "$STATUS" = "200" ]; then
              echo "[$i/4] $(date '+%H:%M:%S') ✅ HTTP $STATUS — Server alive"
            else
              echo "[$i/4] $(date '+%H:%M:%S') ⚠️ HTTP $STATUS — Server may be restarting"
            fi

            if [ "$i" -lt 4 ]; then
              sleep 60
            fi
          done

          echo "✅ Ping loop done at $(date)"
